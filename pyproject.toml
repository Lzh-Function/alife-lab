[project]
name = "alife-lab"
version = "0.1.0"
description = "Local-first, browser-operated artificial-life research platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary (undecided)" }
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "numpy>=2.3",
    "pyyaml>=6.0.2",
    "psutil>=7.1",
    "pyarrow>=21.0",
    "brotli>=1.1",
]

[project.optional-dependencies]
# Optional JIT backend for BFF (bit-identical to the NumPy backend; selected automatically).
fast = ["numba>=0.68"]
# Optional CUDA backend (CuPy with pip-installed CUDA 13 toolkit libraries, ~1.9 GB).
# Results: BFF bit-identical to the CPU oracle; Lenia/Flow-Lenia within documented tolerances.
gpu = ["cupy-cuda13x[ctk]>=14.2"]
# Optional autodiff runtime for Neural Cellular Automata training (CPU build of JAX).
nca = ["jax>=0.8"]
# CUDA 13 build of JAX for NCA training/runs on the GPU (with pip CUDA libraries, ~4 GB).
nca-gpu = ["jax[cuda13]>=0.8"]
asal = [
    "open-clip-torch>=3.3",
    "safetensors>=0.6",
    "torch>=2.14",
]
# MuJoCo physics (CPU, float64) for embodied creatures. MJX (JAX) was measured and not adopted
# for small creatures: 4096-way MJX batches on an RTX 5070 reach ~0.37 M steps/s, one CPU
# core ~0.18 M steps/s (ADR 0030).
embodied = ["mujoco>=3.17"]

[project.scripts]
alife = "alife_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "hypothesis>=6.140",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-pyyaml>=6.0",
    "types-psutil>=7.0",
    "cma>=4.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alife_lab"]

[tool.uv]
# Supply-chain guard: only resolve packages published at least ~2 weeks before
# the lock was created. Bump deliberately when updating dependencies.
exclude-newer = "2026-11-04T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: spawns worker processes or servers (CPU only)",
    "e2e: browser end-to-end tests (requires built frontend and Playwright)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/alife_lab"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pyarrow ships without type information.
module = ["pyarrow", "pyarrow.*", "brotli", "numba", "numba.*", "cupy", "cupy.*", "jax", "jax.*",
          "torch", "torch.*", "open_clip", "open_clip.*", "safetensors", "safetensors.*",
          "huggingface_hub", "huggingface_hub.*", "mujoco", "mujoco.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The numba extra is optional: with it installed the JIT decorators are typed, without it
# numba is Any. Keep both environments (local dev with `--extra fast`, CPU-only CI) clean.
module = [
    "alife_lab.substrates.bff.vm_numba",
    "alife_lab.substrates.nca.model",
    "alife_lab.substrates.pd_nca.model",
]
disable_error_code = ["untyped-decorator", "unused-ignore"]
