# Exploratory: how much of a random soup survives after 2000 ticks, by initial density.
schema_version: 1
sweep:
  name: conway_density_survey
  base_preset: conway_random_soup
  overrides:
    world: {width: 64, height: 64}
    runner: {max_steps: 2000, checkpoint_interval: 1000}
  seeds: [1, 2, 3, 4, 5, 6, 7, 8]
  factors:
    - path: initialization.density
      values: [0.1, 0.3, 0.5]
  reference_condition: 0
  endpoint: {metric: alive_cell_count, at: final}
  design: exploratory
  profile_id: cpu_dev
