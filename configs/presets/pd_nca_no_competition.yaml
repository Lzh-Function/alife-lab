preset:
  id: pd_nca_no_competition
  scenario: pd_nca_dish.yaml
  title_key: preset.pd_nca_no_competition.title
  description_key: preset.pd_nca_no_competition.description
  overrides:
    experiment:
      name: pd_nca_no_competition
      dynamics: {competition: uniform}
  expected_observation: >-
    Control (no competition): equal strengths for all alive entities in a cell. All NCAs
