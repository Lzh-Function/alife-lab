preset:
  id: cultural_world_no_composition
  scenario: cultural_world_default.yaml
  title_key: preset.cultural_world_no_composition.title
  description_key: preset.cultural_world_no_composition.description
  overrides:
    experiment:
      name: Cultural World No-Composition Control
      world:
        environment_regime: shifting_patches
        regime_period: 200
      dynamics:
        transmission_regime: all
        transmission:
          vertical: true
          horizontal: true
          oblique: true
          transmission_cost: 0.01
        technology:
          allow_invention: true
          allow_improvement: true
          allow_composition: false
          allow_externalization: true
          max_program_length: 8
          max_skills_per_agent: 5
          invention_prob: 0.025
          artifact_material_cost: 0.25
          artifact_decay_ticks: 250
        max_age: 220
  expected_observation: >-
    Disables combine/transform synthesis and multi-parent composition while holding all ecology,
    transmission, and artifact budgets fixed (negative control for compositional refinement).
  negative_control: cultural_world_compositional
