schema_version: 1
execution:
  id: local_gpu
  target_selector:
    role: local_interactive
    gpu_count: 1
    backend: gpu           # first GPU backend of the substrate (cupy, jax_cuda); never "auto"
  memory:
    policy: probe_available
    max_fraction_of_available: 0.80
    reserve_fraction: 0.15
  scheduling:
    max_active_gpu_jobs: 1
  preview:
    max_fps: 5
  limits:
    max_walltime_seconds: 3600
    max_disk_mb: 4096
