schema_version: 1
execution:
  id: local_cpu
  target_selector:
    role: local_interactive
    gpu_count: 0           # no GPU reservation: runs on CPU-only machines too
    backend: auto          # first CPU backend of the substrate (numpy, numba, jax); never a GPU one
  memory:
    policy: probe_available
    max_fraction_of_available: 0.80
    reserve_fraction: 0.15
  scheduling:
    max_active_gpu_jobs: 1
    adaptive_microbatch: true
  preview:
    max_fps: 5
    adaptive_quality: true
  limits:
    max_walltime_seconds: 3600
    max_disk_mb: 4096
