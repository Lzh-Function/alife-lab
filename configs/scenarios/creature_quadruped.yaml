# Embodied creature (project model): spherical torso, four legs (hip swing + knee lift),
# MuJoCo 3 on the CPU (float64), CPG controller. Hand-designed "wave" gait: legs in turn,
# knee a quarter period after the hip. 1 tick = 5 physics steps of 10 ms.
schema_version: 1
experiment:
  name: creature_quadruped
  mode: exploratory
  substrate: creature
  seed: 0
  initialization:
    height: 0.75
  dynamics:
    timestep: 0.01
    substeps: 5
    gear: 30.0
    friction: 1.0
    density: 300.0
    joint_stiffness: 20.0
    body:
      torso_radius: 0.25
      legs:
      - angle_deg: 45
        upper: 0.3
        lower: 0.4
        radius: 0.05
      - angle_deg: 135
        upper: 0.3
        lower: 0.4
        radius: 0.05
      - angle_deg: 225
        upper: 0.3
        lower: 0.4
        radius: 0.05
      - angle_deg: 315
        upper: 0.3
        lower: 0.4
        radius: 0.05
    controller:
      kind: cpg
      frequency_hz: 1.5
      amplitudes:
      - 0.8
      - 0.8
      - 0.8
      - 0.8
      - 0.8
      - 0.8
      - 0.8
      - 0.8
      phases:
      - 0
      - 0.25
      - 0.25
      - 0.5
      - 0.5
      - 0.75
      - 0.75
      - 0.0
  runner:
    max_steps: 100000
    checkpoint_interval: 500
