schema_version: 1
experiment:
  name: fly_embodied_flywire
  mode: exploratory
  substrate: fly_embodied
  seed: 1
  dataset_id: flywire_783
  wiring: reference
  arena:
    half_size: 6.0
    foods:
      - x: 1.35
        y: 0.30
        radius: 0.36
        kind: sugar
  dynamics:
    clock_unit: tick
    numeric_policy: float32_lif_float64_mujoco
    explore_drive_hz: 110.0
  runner:
    max_steps: 30000
    checkpoint_interval: 15000
  observations:
    metrics:
      - cmd_forward
      - cmd_turn
      - cmd_proboscis
      - cmd_grooming
      - distance_cm
      - feeding_ms
      - grooming_ms
      - realtime_factor
