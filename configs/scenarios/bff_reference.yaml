# BFF primordial soup with CuBFF semantics (bff_noheads). CuBFF's own default soup is
# 131072 programs; 4096 keeps one epoch at ~0.2 s on one CPU core (a CuBFF flag, so the
# run is still a faithful reproduction of the algorithm at this soup size).
schema_version: 1
experiment:
  name: bff_reference
  mode: reference
  substrate: bff
  seed: 0
  soup: {num_programs: 4096, init: random}
  dynamics:
    clock_unit: epoch
    numeric_policy: exact_integer
    variant: bff_noheads
    mutation_prob: 262144        # 2^18 / 2^30 = 1/4096 per byte (CuBFF default)
    step_limit: 8192
  runner: {max_steps: 100000, checkpoint_interval: 200}
  observations:
    metrics: [h0_bits_per_byte, brotli_bits_per_byte, higher_order_entropy, ops_per_pair,
              unique_programs, top_program_fraction, mutated_bytes]
