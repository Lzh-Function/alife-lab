# ASAL on multichannel Lenia, configured like SakanaAI/asal (main_opt.py defaults, substrate
# "lenia"): creature 5N7KKM in a 128 x 128 world, 256 ticks, prompts "a biological cell" then
# "two biological cells" (2 frames at the chunk ends, frame t paired with prompt t mod 2), the
# 64 x 64 crop centred on the pattern shown to CLIP ViT-B/32, the 45 kernel parameters m, s, h
# perturbed within +-1 in logit space of the creature's values (ASAL clip1 = 1), population 16,
# step size 0.1 logit units (= 0.05 of the box).
# Deviations: full CMA-ES (ASAL: Sep-CMA-ES), the 3072 initial-cell parameters are not searched
# (ASAL perturbs them too; clip2 = inf), centring by circular centroid (ASAL: mass centre with
# Leniabreeder's re-centring roll), 40 generations by default (ASAL: 1000 iterations).
schema_version: 1
experiment:
  name: search_asal_lenia_mc
  mode: exploratory
  substrate: search
  seed: 1
  target:
    name: asal_mc_candidate
    mode: exploratory
    substrate: lenia_mc
    seed: 0
    world:
      size: 128
      boundary: periodic
    initialization:
      preset: pattern
      pattern: 5N7KKM
