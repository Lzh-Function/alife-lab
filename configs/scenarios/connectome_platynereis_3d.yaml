schema_version: 1
experiment:
  name: Connectome Platynereis 3D Larva
  mode: exploratory
  substrate: connectome
  seed: 42
  dataset_id: platynereis_3d
  wiring: reference
  stimuli:
    - port: platy_photoreceptor_prc
      rate_hz: 150.0
  silenced_ports: []
  runner:
    max_steps: 500
    checkpoint_interval: 100
  observations:
    metrics:
      - spikes_tick
      - active_neurons_tick
      - total_spikes
      - mean_firing_rate_hz
      - mean_v_mv
      - time_ms
