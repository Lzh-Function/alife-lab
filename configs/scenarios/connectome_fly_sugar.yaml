schema_version: 1
experiment:
  name: connectome_fly_sugar_150hz
  mode: reference
  substrate: connectome
  seed: 1
  dataset_id: flywire_783
  wiring: reference
  stimuli:
    - port: sugar_grn
      rate_hz: 150.0
  runner:
    max_steps: 1000
    checkpoint_interval: 250
  observations:
    metrics:
      - spikes_tick
      - active_neurons_tick
      - mn9_spikes_tick
      - mn9_rate_hz
      - mean_firing_rate_hz
      - mean_v_mv
      - time_ms
